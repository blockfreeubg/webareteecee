<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PC Stream Viewer</title>
</head>
<body>
  <h1>📺 PC Stream Viewer</h1>
  <video id="remoteVideo" autoplay playsinline muted controls
         style="width:100%; max-width:800px; background:#000;"></video>
  <br>
  <button id="connectBtn">🔗 Connect to Broadcaster</button>
  <button id="playBtn">▶ Play Video</button>
  <p>Status: <span id="status">not connected</span></p>

  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <script>
    const PEER_ID = new URLSearchParams(location.search).get('id') || 'duderucoolpc123';
    const statusEl = document.getElementById('status');
    const videoEl = document.getElementById('remoteVideo');
    let peer = null;
    let call = null;

    // Create a dummy stream with a real video track (from a canvas)
    function createDummyStream() {
      const canvas = document.createElement('canvas');
      canvas.width = 1;
      canvas.height = 1;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, 1, 1);
      // Capture at 1 fps – the track is real, but the content is just black
      return canvas.captureStream(1);
    }

    const dummyStream = createDummyStream();

    function log(msg) {
      console.log('[Viewer]', msg);
    }

    function initPeer() {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
          ]
        }
      });

      peer.on('open', (id) => {
        log('Peer ready, my ID: ' + id);
        statusEl.textContent = 'Viewer ready – click Connect';
      });

      peer.on('error', (err) => {
        log('Peer error: ' + err.message);
        statusEl.textContent = 'Peer error: ' + err.message;
      });
    }

    function connect() {
      if (!peer) initPeer();
      statusEl.textContent = `Calling ${PEER_ID}...`;
      log('Calling ' + PEER_ID);

      if (call) call.close();
      call = peer.call(PEER_ID, dummyStream);

      call.on('stream', (remoteStream) => {
        log('✅ Received remote stream');
        log('Tracks: ' + remoteStream.getTracks().map(t => `${t.kind}:${t.readyState}`));
        statusEl.textContent = 'Connected!';
        videoEl.srcObject = remoteStream;
        videoEl.load();
        videoEl.play()
          .then(() => log('Video playing'))
          .catch(err => {
            log('Autoplay failed: ' + err.message);
            statusEl.textContent = 'Click ▶ Play Video to start';
          });
      });

      call.on('close', () => {
        log('Call closed');
        statusEl.textContent = 'Connection closed';
      });

      call.on('error', (err) => {
        log('Call error: ' + err.message);
        statusEl.textContent = 'Call error: ' + err.message;
      });
    }

    document.getElementById('connectBtn').addEventListener('click', connect);
    document.getElementById('playBtn').addEventListener('click', () => videoEl.play().catch(e => log(e)));

    initPeer();
  </script>
</body>
</html>
