<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PC Stream Viewer + Remote Control</title>
  <style>
    #remoteVideo {
      width: 100%;
      max-width: 800px;
      background: #000;
      cursor: crosshair;
      outline: none;
    }
    .control-panel {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>📺 PC Stream Viewer</h1>
  <video id="remoteVideo" autoplay playsinline muted tabindex="0"></video>
  <div class="control-panel">
    <button id="connectBtn">🔗 Connect</button>
    <button id="playBtn">▶ Play</button>
    <button id="enableCtrlBtn">🖱️ Enable Remote Control</button>
    <span id="status">not connected</span>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <script>
    const PEER_ID = new URLSearchParams(location.search).get('id') || 'duderucoolpc123';
    const statusEl = document.getElementById('status');
    const videoEl = document.getElementById('remoteVideo');
    const connectBtn = document.getElementById('connectBtn');
    const playBtn = document.getElementById('playBtn');
    const enableCtrlBtn = document.getElementById('enableCtrlBtn');

    let peer = null;
    let call = null;
    let isControlling = false;

    // Dummy stream with video track (canvas)
    function createDummyStream() {
      const canvas = document.createElement('canvas');
      canvas.width = 1; canvas.height = 1;
      canvas.getContext('2d').fillRect(0,0,1,1);
      return canvas.captureStream(1);
    }
    const dummyStream = createDummyStream();

    function log(msg) {
      console.log('[Viewer]', msg);
    }

    function initPeer() {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
          ]
        }
      });

      peer.on('open', (id) => {
        log('Peer ready, my ID: ' + id);
        statusEl.textContent = 'Viewer ready – click Connect';
      });

      peer.on('error', (err) => {
        log('Peer error: ' + err.message);
        statusEl.textContent = 'Peer error: ' + err.message;
      });
    }

    function connect() {
      if (!peer) initPeer();
      statusEl.textContent = `Calling ${PEER_ID}...`;
      log('Calling ' + PEER_ID);

      if (call) call.close();
      call = peer.call(PEER_ID, dummyStream);

      call.on('stream', (remoteStream) => {
        log('✅ Received remote stream');
        statusEl.textContent = 'Connected!';
        videoEl.srcObject = remoteStream;
        videoEl.load();
        videoEl.play().catch(err => {
          log('Autoplay failed: ' + err.message);
          statusEl.textContent = 'Click ▶ Play to start';
        });
      });

      call.on('close', () => {
        log('Call closed');
        statusEl.textContent = 'Connection closed';
        isControlling = false;
      });

      call.on('error', (err) => {
        log('Call error: ' + err.message);
        statusEl.textContent = 'Call error: ' + err.message;
      });
    }

    // ---------- Remote Control Handling ----------

    function sendData(data) {
      if (call && call.open) {
        call.send(data);
        log('Sent: ' + JSON.stringify(data));
      } else {
        log('No active call, cannot send');
      }
    }

    // Enable remote control
    enableCtrlBtn.addEventListener('click', async () => {
      if (!call || !call.open) {
        alert('Not connected to broadcaster yet.');
        return;
      }
      // Set focus to video for keyboard events
      videoEl.focus();
      isControlling = true;
      statusEl.textContent = 'Remote control ACTIVE – move mouse over video, click, and type';
      log('Remote control enabled');
    });

    // Disable remote control (optional: click button again or press Escape)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isControlling) {
        isControlling = false;
        statusEl.textContent = 'Remote control disabled';
        log('Remote control disabled');
      }
    });

    // Mouse move (throttled to 50ms)
    let lastMoveSent = 0;
    videoEl.addEventListener('mousemove', (e) => {
      if (!isControlling) return;
      const now = Date.now();
      if (now - lastMoveSent < 50) return;
      lastMoveSent = now;

      const rect = videoEl.getBoundingClientRect();
      const scaleX = videoEl.videoWidth / rect.width;
      const scaleY = videoEl.videoHeight / rect.height;
      const x = Math.round((e.clientX - rect.left) * scaleX);
      const y = Math.round((e.clientY - rect.top) * scaleY);

      sendData({ type: 'mousemove', x, y });
    });

    // Mouse down/up – prevent default to avoid video seeking/play/pause
    videoEl.addEventListener('mousedown', (e) => {
      if (!isControlling) return;
      e.preventDefault();
      sendData({ type: 'mousedown', button: e.button });
    });
    videoEl.addEventListener('mouseup', (e) => {
      if (!isControlling) return;
      e.preventDefault();
      sendData({ type: 'mouseup', button: e.button });
    });
    // Prevent context menu
    videoEl.addEventListener('contextmenu', (e) => {
      if (isControlling) e.preventDefault();
    });

    // Keyboard events (capture on document to catch all keys)
    document.addEventListener('keydown', (e) => {
      if (!isControlling) return;
      e.preventDefault();
      sendData({ type: 'keydown', key: e.key, code: e.code });
    });
    document.addEventListener('keyup', (e) => {
      if (!isControlling) return;
      e.preventDefault();
      sendData({ type: 'keyup', key: e.key, code: e.code });
    });

    // Play button
    playBtn.addEventListener('click', () => {
      videoEl.play().catch(e => log(e));
    });

    connectBtn.addEventListener('click', connect);

    initPeer();
  </script>
</body>
</html>
