<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PC Stream Viewer</title>
</head>
<body>
  <h1>📺 PC Stream Viewer</h1>
  <video id="remoteVideo" autoplay playsinline muted controls
         style="width:100%; max-width:800px; background:#000;"></video>
  <br>
  <button id="connectBtn">🔗 Connect to Broadcaster</button>
  <button id="playBtn">▶ Play Video</button>
  <p>Status: <span id="status">not connected</span></p>

  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <script>
    const PEER_ID = new URLSearchParams(location.search).get('id') || 'duderucoolpc123';
    const statusEl = document.getElementById('status');
    const videoEl = document.getElementById('remoteVideo');
    const dummyStream = new MediaStream();
    let peer = null;
    let call = null;

    // Initialize viewer peer
    function initPeer() {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
          ]
        }
      });

      peer.on('open', (id) => {
        console.log('Viewer peer ready, ID:', id);
        statusEl.textContent = 'Viewer ready – click Connect';
      });

      peer.on('error', (err) => {
        console.error('Viewer peer error:', err);
        statusEl.textContent = 'Peer error: ' + err.message;
      });
    }

    // Connect to broadcaster
    function connect() {
      if (!peer) initPeer();
      statusEl.textContent = `Calling ${PEER_ID}...`;
      console.log('Calling', PEER_ID);

      if (call) call.close();

      call = peer.call(PEER_ID, dummyStream);

      call.on('stream', (remoteStream) => {
        console.log('✅ Received remote stream');
        console.log('Tracks:', remoteStream.getTracks().map(t => `${t.kind}:${t.readyState}`));

        statusEl.textContent = 'Connected!';
        videoEl.srcObject = remoteStream;
        videoEl.load();  // force reload
        videoEl.play()
          .then(() => console.log('Video playing'))
          .catch(err => {
            console.error('Autoplay failed:', err);
            statusEl.textContent = 'Click ▶ Play Video to start';
          });
      });

      call.on('close', () => {
        console.log('Call closed');
        statusEl.textContent = 'Connection closed';
      });

      call.on('error', (err) => {
        console.error('Call error:', err);
        statusEl.textContent = 'Call error: ' + err.message;
      });
    }

    // Event listeners
    document.getElementById('connectBtn').addEventListener('click', connect);
    document.getElementById('playBtn').addEventListener('click', () => {
      videoEl.play().catch(e => console.error(e));
    });

    // Auto-init on page load (optional)
    initPeer();
  </script>
</body>
</html>
