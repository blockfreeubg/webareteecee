<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PC Stream Viewer (Diagnostic)</title>
</head>
<body>
  <h1>📺 PC Stream Viewer</h1>
  <video id="remoteVideo" autoplay playsinline muted controls
         style="width:100%; max-width:800px; background:#000;"></video>
  <br>
  <button id="connectBtn">🔗 Connect to Broadcaster</button>
  <button id="playBtn">▶ Play Video</button>
  <p>Status: <span id="status">not connected</span></p>

  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <script>
    const PEER_ID = new URLSearchParams(location.search).get('id') || 'duderucoolpc123';
    const statusEl = document.getElementById('status');
    const videoEl = document.getElementById('remoteVideo');
    const dummyStream = new MediaStream();
    let peer = null;
    let call = null;
    let connectionTimeout = null;

    function log(msg) {
      console.log('[Viewer]', msg);
    }

    function initPeer() {
      peer = new Peer({
        debug: 2, // extra PeerJS logs
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
          ]
        }
      });

      peer.on('open', (id) => {
        log('Peer ready, my ID: ' + id);
        statusEl.textContent = 'Viewer ready – click Connect';
      });

      peer.on('error', (err) => {
        log('Peer error: ' + err.message);
        statusEl.textContent = 'Peer error: ' + err.message;
      });
    }

    function connect() {
      if (!peer) initPeer();
      statusEl.textContent = `Calling ${PEER_ID}...`;
      log('Calling ' + PEER_ID);

      if (call) call.close();
      call = peer.call(PEER_ID, dummyStream);

      // Log call events
      call.on('stream', (remoteStream) => {
        clearTimeout(connectionTimeout);
        log('✅ Received remote stream');
        log('Tracks: ' + remoteStream.getTracks().map(t => `${t.kind}:${t.readyState}`));
        statusEl.textContent = 'Connected!';
        videoEl.srcObject = remoteStream;
        videoEl.load();
        videoEl.play()
          .then(() => log('Video playing'))
          .catch(err => {
            log('Autoplay failed: ' + err.message);
            statusEl.textContent = 'Click ▶ Play Video to start';
          });
      });

      call.on('close', () => {
        clearTimeout(connectionTimeout);
        log('Call closed');
        statusEl.textContent = 'Connection closed';
      });

      call.on('error', (err) => {
        clearTimeout(connectionTimeout);
        log('Call error: ' + err.message);
        statusEl.textContent = 'Call error: ' + err.message;
      });

      // Log ICE connection state changes
      if (call.peerConnection) {
        call.peerConnection.addEventListener('connectionstatechange', () => {
          log('ICE connection state: ' + call.peerConnection.connectionState);
          statusEl.textContent = `ICE state: ${call.peerConnection.connectionState}`;
        });
        call.peerConnection.addEventListener('iceconnectionstatechange', () => {
          log('ICE connection state (legacy): ' + call.peerConnection.iceConnectionState);
        });
      }

      // Timeout if no stream after 10 seconds
      connectionTimeout = setTimeout(() => {
        if (!videoEl.srcObject) {
          log('❌ Timeout: no stream received after 10s');
          statusEl.textContent = 'Timeout – no stream. Check broadcaster console.';
        }
      }, 10000);
    }

    document.getElementById('connectBtn').addEventListener('click', connect);
    document.getElementById('playBtn').addEventListener('click', () => videoEl.play().catch(e => log(e)));

    initPeer();
  </script>
</body>
</html>
