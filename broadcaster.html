<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PC Stream Broadcaster</title>
</head>
<body>
  <h1>🖥️ PC Stream Broadcaster</h1>
  <button id="startBtn">Start Sharing Screen</button>
  <p>Status: <span id="status">idle</span></p>
  <div id="previewContainer"></div>

  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <script>
    const PEER_ID = new URLSearchParams(location.search).get('id') || 'duderucoolpc123';
    const statusEl = document.getElementById('status');
    let localStream = null;
    let peer = null;

    document.getElementById('startBtn').addEventListener('click', async () => {
      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });
        console.log('Screen capture started, tracks:', localStream.getTracks().map(t => `${t.kind}:${t.readyState}`));

        // Show local preview
        const container = document.getElementById('previewContainer');
        container.innerHTML = '';
        const video = document.createElement('video');
        video.srcObject = localStream;
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        video.style.width = '300px';
        video.style.marginTop = '10px';
        container.appendChild(video);

        statusEl.textContent = 'Screen captured. Initializing peer...';
        initPeer();
      } catch (err) {
        console.error('Screen capture failed:', err);
        statusEl.textContent = 'Error: ' + err.message;
      }
    });

    function initPeer() {
      peer = new Peer(PEER_ID, {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
          ]
        }
      });

      peer.on('open', (id) => {
        console.log('Broadcaster peer ready, ID:', id);
        statusEl.textContent = `✅ Peer ready! ID: ${id} — waiting for viewers...`;
      });

      peer.on('call', (call) => {
        console.log('📞 Incoming call from viewer');
        statusEl.textContent = 'Incoming call, answering...';
        call.answer(localStream);
        call.on('close', () => {
          console.log('Viewer disconnected');
          statusEl.textContent = 'Viewer disconnected';
        });
        call.on('error', (err) => {
          console.error('Call error:', err);
          statusEl.textContent = 'Call error: ' + err.message;
        });
      });

      peer.on('error', (err) => {
        console.error('Broadcaster peer error:', err);
        statusEl.textContent = '❌ Peer error: ' + err.message;
      });
    }
  </script>
</body>
</html>
