<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PC Stream Broadcaster (Guarded)</title>
</head>
<body>
  <h1>🖥️ PC Stream Broadcaster</h1>
  <button id="startBtn">Start Sharing Screen</button>
  <p>Status: <span id="status">idle</span></p>
  <div id="previewContainer"></div>

  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <script>
    const PEER_ID = new URLSearchParams(location.search).get('id') || 'duderucoolpc123';
    const statusEl = document.getElementById('status');
    let localStream = null;
    let peer = null;

    function log(msg) {
      console.log('[Broadcaster]', msg);
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });
        log('Screen capture started');
        log('Tracks: ' + localStream.getTracks().map(t => `${t.kind}:${t.readyState}`));

        // Show local preview
        const container = document.getElementById('previewContainer');
        container.innerHTML = '';
        const video = document.createElement('video');
        video.srcObject = localStream;
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        video.style.width = '300px';
        container.appendChild(video);

        statusEl.textContent = 'Screen captured. Initializing peer...';
        initPeer();
      } catch (err) {
        log('Screen capture failed: ' + err.message);
        statusEl.textContent = 'Error: ' + err.message;
      }
    });

    function initPeer() {
      peer = new Peer(PEER_ID, {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
          ]
        }
      });

      peer.on('open', (id) => {
        log('Peer ready, ID: ' + id);
        statusEl.textContent = `✅ Peer ready! ID: ${id} — waiting for viewers...`;
      });

      peer.on('call', (call) => {
        log('📞 Incoming call');
        statusEl.textContent = 'Incoming call, answering...';

        // ✅ Guard: ensure localStream exists and has a video track
        if (!localStream || localStream.getVideoTracks().length === 0 || localStream.getVideoTracks()[0].readyState !== 'live') {
          log('❌ ERROR: No live video track to share! Did you click "Start Sharing Screen"?');
          statusEl.textContent = '❌ No screen capture active. Click Start Sharing Screen first.';
          call.close();
          return;
        }

        call.answer(localStream);

        call.on('close', () => {
          log('Viewer disconnected');
          statusEl.textContent = 'Viewer disconnected';
        });
        call.on('error', (err) => {
          log('Call error: ' + err.message);
          statusEl.textContent = 'Call error: ' + err.message;
        });

        // Log ICE state
        if (call.peerConnection) {
          call.peerConnection.addEventListener('connectionstatechange', () => {
            log('ICE connection state: ' + call.peerConnection.connectionState);
          });
        }
      });

      peer.on('error', (err) => {
        log('Peer error: ' + err.message);
        statusEl.textContent = '❌ Peer error: ' + err.message;
      });
    }
  </script>
</body>
</html>
